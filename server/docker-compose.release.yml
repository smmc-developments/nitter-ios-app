services:
  nitter:
    image: ghcr.io/smmc-developments/nitter-ios-app:${NITTER_VERSION:-${XCANCEL_VERSION:-latest}}
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      API_KEY: ${API_KEY:?Set API_KEY in .env}
      PROXY_SECRET: ${PROXY_SECRET:?Set PROXY_SECRET in .env}
      WEB_USERNAME: ${WEB_USERNAME:-}
      WEB_PASSWORD: ${WEB_PASSWORD:-}
      ALLOW_INSECURE_NO_AUTH: ${ALLOW_INSECURE_NO_AUTH:-false}
      TWV_API_URL: ${TWV_API_URL:-https://api.twitterwebviewer.com}
      TWV_SITE_URL: ${TWV_SITE_URL:-https://twitterwebviewer.com}
      FETCH_MINUTES: ${FETCH_MINUTES:-15}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MAX_ACCOUNTS_PER_CYCLE: ${MAX_ACCOUNTS_PER_CYCLE:-40}
      FETCH_CONCURRENCY: ${FETCH_CONCURRENCY:-2}
      FETCH_START_INTERVAL_MS: ${FETCH_START_INTERVAL_MS:-1000}
      MAX_PAGES_PER_ACCOUNT: ${MAX_PAGES_PER_ACCOUNT:-5}
    volumes:
      - nitter-data:/app/data
    init: true
    shm_size: 1gb
    restart: unless-stopped

volumes:
  nitter-data:
    name: nitter-ios-app-data
